<tr id="source-{{ source.id }}">
    <td>
        <input
            type="text"
            class="form-control form-control-sm {% if errors and errors.name %}is-invalid{% endif %}"
            name="name"
            value="{{ source.name }}"
            required
        >
        {% if errors and errors.name %}
            <div class="invalid-feedback">{{ errors.name }}</div>
        {% endif %}
    </td>
    <td>
        <input
            type="text"
            class="form-control form-control-sm {% if errors and errors.url %}is-invalid{% endif %}"
            name="url"
            value="{{ source.url }}"
            required
        >
        {% if errors and errors.url %}
            <div class="invalid-feedback">{{ errors.url }}</div>
        {% endif %}
    </td>
    <td>
        <select
            class="form-select form-select-sm {% if errors and errors.source_type %}is-invalid{% endif %}"
            name="source_type"
            required
        >
            <option value="apify" {% if source.source_type.value == "apify" %}selected{% endif %}>Apify</option>
            <option value="rss" {% if source.source_type.value == "rss" %}selected{% endif %}>RSS</option>
        </select>
        {% if errors and errors.source_type %}
            <div class="invalid-feedback">{{ errors.source_type }}</div>
        {% endif %}
    </td>
    <td>
        <input
            type="text"
            class="form-control form-control-sm"
            name="actor_id"
            value="{{ source.actor_id or '' }}"
            placeholder="Optional"
        >
    </td>
    <td>
        <div class="form-check">
            <input
                type="checkbox"
                class="form-check-input"
                name="enabled"
                id="enabled-{{ source.id }}"
                {% if source.enabled %}checked{% endif %}
            >
            <label class="form-check-label" for="enabled-{{ source.id }}">
                Enabled
            </label>
        </div>
    </td>
    <td class="text-end actions-cell">
        <div class="btn-group btn-group-sm" role="group">
            <button
                type="button"
                class="btn btn-success"
                title="Save"
                hx-post="/admin/sources/{{ source.id }}"
                hx-include="closest tr"
                hx-target="closest tr"
                hx-swap="outerHTML"
            >
                <i class="bi bi-check-lg"></i>
            </button>
            <button
                type="button"
                class="btn btn-secondary"
                title="Cancel"
                hx-get="/admin/sources"
                hx-target="#source-table-body"
            >
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </td>
</tr>
